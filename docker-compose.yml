services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    ports:
      - "8000:8000"
    command: -jar DynamoDBLocal.jar -sharedDb

  dynamodb-setup:
    image: amazon/aws-cli:latest
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_DEFAULT_REGION: ap-northeast-1
    entrypoint:
      - sh
      - -c
      - |
        aws dynamodb create-table \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name Cars \
          --attribute-definitions AttributeName=carName,AttributeType=S \
          --key-schema AttributeName=carName,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
        2>/dev/null || true

        aws dynamodb create-table \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name HtmlCache \
          --attribute-definitions AttributeName=url,AttributeType=S \
          --key-schema AttributeName=url,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
        2>/dev/null || true

         echo "DynamoDB setup completed."

  get-car-function:
    build:
      context: .
      args:
        HANDLER: get-cars
        BUILD_ENV: dev
    depends_on:
      dynamodb-setup:
        condition: service_completed_successfully
    env_file: .env
    environment:
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - AWS_REGION=ap-northeast-1
      - AWS_DEFAULT_REGION=ap-northeast-1
      - AWS_ENDPOINT_URL=http://dynamodb-local:8000
      - NO_CACHE=1
    ports:
      - "9000:8080"

  init-db-function:
    build:
      context: .
      args:
        HANDLER: init-db
    depends_on:
      dynamodb-setup:
        condition: service_completed_successfully
    environment:
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - AWS_REGION=ap-northeast-1
      - AWS_DEFAULT_REGION=ap-northeast-1
      - AWS_ENDPOINT_URL=http://dynamodb-local:8000
    ports:
      - "9001:8080"
